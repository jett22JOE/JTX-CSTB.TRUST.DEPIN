[features]
seeds = false
skip-lint = false

[programs.localnet]
jtx_optx_devnet_poa_trustjoe = "85sqs4upQiPrvk1NMuyfHVQoW1EGdgk8m2cQb7uMxXTF"
jett_vault = "JTX5uXTiZ1M3hJkjv5Cp5F8dr3Jc7nhJbQjCFmgEYA7"

# Devnet — separate program IDs so Phantom Blowfish can distinguish
# devnet test transactions from mainnet ones. Build with:
#   anchor build -p jett-vault -- --features devnet
[programs.devnet]
jtx_optx_devnet_poa_trustjoe = "79nQsecDspUWxvAMyJvK36EUty4yEoP5ssLvHZuNiugF"
jett_vault = "ExjFkkX3Zogyb5uBeaff8FdKZbjjVHcCHgcaQiP3qQDS"

# Mainnet — JTX protocol live as of 2026-05-23
#   jtx_optx_devnet_poa_trustjoe = PoA DePIN program (gaze attestation + OPTX mint)
#   jett_vault     = Community vault (donations, refunds, AGT, AARON audit)
# Treasury (9WssA...YD7) is tri-authority (JOE + Founder + Treasury)
# Upgrade authority transfer to Squads multisig — see jettoptx-saas/SQUADS-RUNBOOK.md
[programs.mainnet]
jtx_optx_devnet_poa_trustjoe = "85sqs4upQiPrvk1NMuyfHVQoW1EGdgk8m2cQb7uMxXTF"
jett_vault = "JTX5uXTiZ1M3hJkjv5Cp5F8dr3Jc7nhJbQjCFmgEYA7"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000

[test.validator]
url = "https://api.mainnet-beta.solana.com"

# Clone $JTX v2 token for testing
[[test.validator.clone]]
address = "JTXGnx83s2QZ2MwYkRD1cBKrqQKSdG5oe8vSYW5Zjoe"

# Token program
[[test.validator.clone]]
address = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"

# Token-2022 program for $OPTX
