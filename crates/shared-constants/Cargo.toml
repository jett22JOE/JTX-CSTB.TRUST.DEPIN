[package]
name = "shared-constants"
version = "0.1.0"
edition = "2021"
description = "Shared constants for jett-vault, jtx-buy-vault, and jtx-optx-devnet-poa-trustjoe programs. Single source of truth for tier thresholds, mint caps, prices, and oracle feed addresses — prevents threshold/price desync across program upgrades."
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
no-entrypoint = []
# Anchor's IDL build pass invokes every workspace crate with `--features
# idl-build`. shared-constants has no anchor deps, so this is intentionally
# an empty feature flag — present only to satisfy the toolchain.
idl-build = []

[dependencies]
# No deps — pure constants. Keeps the crate cheap to depend on.
