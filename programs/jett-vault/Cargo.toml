[package]
name = "jett-vault"
version = "2.0.0"
description = "ASTRO KNOTS VAULT — AGT Attestation + Knot Invariants + AARON Audit + Fundraising"
edition = "2021"
license = "MIT"
repository = "https://github.com/jett22JOE/JTX-CSTB.TRUST.DEPIN"

[lib]
crate-type = ["cdylib", "lib"]
name = "jett_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "metadata"] }
solana-program = "1.18"
mpl-token-metadata = { version = "4.1", features = ["no-entrypoint"] }
jtx-cstb-trust = { path = "../jtx-cstb-trust", features = ["cpi"] }
