[package]
name = "jett-vault"
version = "2.0.0"
description = "ASTRO KNOTS VAULT — AGT Attestation + Knot Invariants + AARON Audit + Fundraising"
edition = "2021"
license = "MIT"
repository = "https://github.com/jettoptx/jettoptx-poa-depin"

[lib]
crate-type = ["cdylib", "lib"]
name = "jett_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Build with a different on-chain program ID so Phantom Blowfish can
# distinguish devnet test transactions from mainnet ones (same program ID
# on both networks → Phantom flags every devnet tx as "valid on mainnet").
# Use:  anchor build -- --features devnet
devnet = ["jtx-optx-devnet-poa-trustjoe/devnet"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
solana-program = "1.18"
jtx-optx-devnet-poa-trustjoe = { path = "../jtx-optx-devnet-poa-trustjoe", features = ["cpi"] }
shared-constants = { path = "../../crates/shared-constants" }
pyth-solana-receiver-sdk = "0.6"
# Metaplex Core for B3.10 — mint_donor_nft CPIs to CreateV2 so the
# DonorReceipt PDA is paired with a real wallet-visible NFT asset.
mpl-core = "0.10.0"
