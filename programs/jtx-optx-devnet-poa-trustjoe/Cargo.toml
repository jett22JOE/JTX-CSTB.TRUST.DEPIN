[package]
name = "jtx-optx-devnet-poa-trustjoe"
version = "0.1.0"
description = "JTX OPTX Proof-of-Attention Trust — verified human-compute attestations on Solana"
edition = "2021"
license = "MIT"
repository = "https://github.com/jettoptx/jettoptx-poa-depin"

[lib]
crate-type = ["cdylib", "lib"]
name = "jtx_optx_devnet_poa_trustjoe"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Build with a different on-chain program ID so Phantom Blowfish can
# distinguish devnet test transactions from mainnet ones.
# Use:  anchor build -p jtx-optx-devnet-poa-trustjoe -- --features devnet
devnet = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
solana-program = "1.18"
